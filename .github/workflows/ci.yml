name: CI — dbt Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  dbt-compile:
    name: Compilar modelos dbt (validação de sintaxe)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar UV
        run: pip install uv

      - name: Instalar dependências Python
        working-directory: 1_local_setup
        run: uv sync

      - name: Instalar dbt-postgres
        run: pip install dbt-postgres

      - name: Criar profiles.yml (CI)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          dw_bootcamp:
            target: dev
            outputs:
              dev:
                type: postgres
                host: postgres
                port: 5432
                user: postgres
                password: postgres
                dbname: dbt_db
                schema: public
                threads: 4
          EOF

      - name: Instalar dependências dbt
        working-directory: 2_data_warehouse/dw_bootcamp
        run: dbt deps --profiles-dir ~/.dbt

      - name: Validar sintaxe dbt (parse)
        working-directory: 2_data_warehouse/dw_bootcamp
        run: dbt parse --profiles-dir ~/.dbt


  dbt-build:
    name: Executar pipeline completo (seed + run + test)
    runs-on: ubuntu-latest
    needs: dbt-compile

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dbt_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar UV
        run: pip install uv

      - name: Instalar dependências Python
        working-directory: 1_local_setup
        run: uv sync

      - name: Instalar dbt-postgres
        run: pip install dbt-postgres

      - name: Criar profiles.yml (CI)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          dw_bootcamp:
            target: dev
            outputs:
              dev:
                type: postgres
                host: postgres
                port: 5432
                user: postgres
                password: postgres
                dbname: dbt_db
                schema: public
                threads: 4
          EOF

      - name: dbt debug
        working-directory: 2_data_warehouse/dw_bootcamp
        run: dbt debug --profiles-dir ~/.dbt

      - name: dbt seed
        working-directory: 2_data_warehouse/dw_bootcamp
        run: dbt seed --profiles-dir ~/.dbt

      - name: dbt build
        working-directory: 2_data_warehouse/dw_bootcamp
        run: dbt build --exclude-resource-type seed --profiles-dir ~/.dbt

      - name: dbt docs generate
        working-directory: 2_data_warehouse/dw_bootcamp
        run: dbt docs generate --profiles-dir ~/.dbt

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: 2_data_warehouse/dw_bootcamp/target/
          retention-days: 7